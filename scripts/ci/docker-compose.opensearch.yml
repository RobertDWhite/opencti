# Merged over docker-compose.yml (COMPOSE_FILE) by the backend tests matrix to run against OpenSearch.
# The service keeps its name, so ELASTICSEARCH__URL, the ports and the log steps stay the same.
services:
  elasticsearch:
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    # Replaced, not merged: OpenSearch refuses to start with the xpack settings of Elasticsearch
    environment: !override
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2G -Xmx2G"
